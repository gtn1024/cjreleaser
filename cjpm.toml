[package]
cjc-version = "1.1.3"
name = "cjreleaser"
version = "0.1.0"
description = "Automated release tool for Cangjie monorepo packages"
output-type = "executable"
link-option = "-lcangjie-dynamicLoader-opensslFFI -lstdx.net.tlsFFI -lstdx.crypto.x509FFI -lstdx.crypto.keysFFI -lstdx.encoding.jsonFFI -lstdx.encoding.json.streamFFI"
authors = ["cjreleaser"]

[dependencies]
cjxe = "0.3.0"
termcolor = "1.0.0"
stdx = "1.1.0"
